<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piggy Track</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/externalJs/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>Piggy Track</h1>
      <nav>
        <button id="addExpenseBtn">Add Expense</button>
        <button id="viewExpensesBtn">Expense History</button>
        <button id="reportsBtn">Reports</button>
      </nav>
    </header>

    <main>
      <!-- Add Expense Form -->
      <section id="addExpenseSection" class="hidden">
        <h2>Add Expense</h2>
        <form id="expenseForm">
          <label for="amount">Amount (₹):</label>
          <input type="number" id="amount" required />
          <div class="flex">
            <div>
              <label for="category">Category:</label>
              <select id="category">
                <option value="Food">Food</option>
                <option value="Rent">Rent</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities</option>
                <option value="Miscellaneous">Miscellaneous</option>
              </select>
            </div>
            <div>
              <label for="date">Date:</label>
              <input type="date" id="date" required />
            </div>
          </div>
          <label for="description">Description:</label>
          <textarea id="description" rows="3"></textarea>
          <button type="submit">Save Expense</button>
        </form>
      </section>

      <!-- Expense History -->
      <section id="expenseHistorySection" class="hidden">
        <h2>Expense History</h2>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Description</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </section>

      <!-- Reports -->
      <section id="reportsSection" class="hidden">
        <h2>Expense Reports</h2>
        <div class="chart-pie">
          <canvas id="categoryChart"></canvas>
        </div>
      </section>
    </main>

    <script src="scripts/storage.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/charts.js"></script>
  </body>
</html>
